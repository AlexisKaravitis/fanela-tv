plugins { id 'com.android.application' }

// Release signing: keystore.properties next to this file (never committed). Without it, release builds are unsigned.
// GitHub "owner/repo" whose releases carry new APKs (in-app updates). Empty = no update checks, and a release asks for
// no install permission (the updater's manifest entries are added only when this is set: src/updater).
def updateRepo = ''

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'app.fanela.tv'
    compileSdk 36

    defaultConfig {
        // The worldwide exploration: its own id, so it installs next to the real Fanela (app.fanela.tv) and never
        // replaces it. The Java package (namespace) stays app.fanela.tv.
        applicationId 'app.fanela.tv'
        minSdk 26          // Android TV 8.0: first version with home-screen rows (preview channels)
        targetSdk 36
        versionCode 12
        versionName '1.3.0'
        resourceConfigurations += ['en', 'el']
        // Club crests and exact channels from the TV guides (both can be switched off for a stricter build).
        buildConfigField 'boolean', 'REMOTE_IMAGES', 'true'
        buildConfigField 'boolean', 'GUIDES', 'true'
        buildConfigField 'String', 'UPDATE_REPO', '"' + updateRepo + '"'
        // Ronin Sport API key: never in a release (see the debug build type). Empty = off.
        buildConfigField 'String', 'RONIN_KEY', '""'
        // Formula 1 and UFC (Settings > More sports): on in every build since 1.3.0; false builds a football-only app
        buildConfigField 'boolean', 'SPORTS', 'true'
    }

    buildFeatures { buildConfig true }

    // the updater's permission and receiver: debug builds always (src/debug), a release only when it can update itself
    if (!updateRepo.isEmpty()) sourceSets { release { manifest.srcFile 'src/updater/AndroidManifest.xml' } }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            // Ronin Sport API key for per-match channels outside Greece (keystore.properties "roninKey"); debug builds
            // only, until the provider is finished and the key lives on a server instead of in the APK
            buildConfigField 'String', 'RONIN_KEY', '"' + (ks['roninKey'] ?: '').replaceAll('[^A-Za-z0-9._-]', '') + '"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        xmlReport true
        htmlReport true
    }

    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
